name: Continuous 0DTE Scanner

on:
  schedule:
    # Start at 9:25 AM ET every weekday (ready before market open)
    - cron: "25 13 * * 1-5"
  workflow_dispatch:

jobs:
  continuous-scan:
    name: Continuous Market Scanner
    runs-on: self-hosted
    timeout-minutes: 420  # 7 hours (market hours)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Restore trade state
        uses: actions/cache@v4
        with:
          path: logs/active_trades.json
          key: trades-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trades-${{ runner.os }}-
      
      - name: Run continuous scanner
        env:
          EMAIL_ADDRESS:      ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          RECIPIENT_PHONE:    ${{ secrets.RECIPIENT_PHONE }}
          CARRIER:            ${{ secrets.CARRIER }}
          APCA_API_KEY_ID:    ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
        run: |
          echo "Starting continuous scanner at $(date -u)"
          SCAN_INTERVAL=30  # seconds between scans
          
          while true; do
            CURRENT_TIME=$(date -u +%H%M)
            
            # Market hours: 13:30 - 21:00 UTC (9:30 AM - 5:00 PM ET)
            if [ "$CURRENT_TIME" -ge 1330 ] && [ "$CURRENT_TIME" -lt 2100 ]; then
              echo "=== Scan at $(date -u +%H:%M:%S) UTC ==="
              python main.py
              echo "Sleeping ${SCAN_INTERVAL}s until next scan..."
              sleep $SCAN_INTERVAL
            else
              echo "Outside market hours. Exiting."
              break
            fi
          done
      
      - name: Save trade state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/active_trades.json
          key: trades-${{ runner.os }}-${{ github.run_id }}
